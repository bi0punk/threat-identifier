[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-identifier"
version = "1.0.0"
description = "Attack detection system using machine learning to analyze access logs and predict whether an event is an attack."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "joblib>=1.3",
    "scikit-learn>=1.3",
    "watchdog>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
